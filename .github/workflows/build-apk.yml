name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Diagnose maven access
        run: |
          for u in \
            "https://repo.maven.apache.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.1.10-1.0.30/com.google.devtools.ksp.gradle.plugin-2.1.10-1.0.30.pom" \
            "https://repo1.maven.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.1.10-1.0.30/com.google.devtools.ksp.gradle.plugin-2.1.10-1.0.30.pom" \
            "https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.1.10-1.0.30/com.google.devtools.ksp.gradle.plugin-2.1.10-1.0.30.pom" \
            "https://maven.aliyun.com/repository/public/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.1.10-1.0.30/com.google.devtools.ksp.gradle.plugin-2.1.10-1.0.30.pom" ; do
              echo "$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 25 "$u")  $u"
            done

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mooic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
